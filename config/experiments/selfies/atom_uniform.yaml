# @package _global_

defaults:
   - override /env: selfies/atom
   - override /gflownet: trajectorybalance
   - override /loss: trajectorybalance
   - override /proxy: uniform
   - override /logger: wandb

# Environment
env:
  elements: "organic"
  additional_charges: null
  additional_bond_constraints: null
  allow_chiral_tag: False
  allow_stereoisomer: False
  isotope_limit: 0
  h_count_limit: 0
  charge_limit: 4
  source_readable: "<source>"

# Buffer
buffer:
  train: null
  test: null

# GFlowNet hyperparameters
gflownet:
  random_action_prob: 0.1
  optimizer:
    batch_size:
      forward: 100
    lr: 0.0001
    z_dim: 16
    lr_z_mult: 100
    n_train_steps: 3000

# Policy
policy:
  forward:
    type: mlp
    n_hid: 128
    n_layers: 2
  backward:
    shared_weights: True

# WandB
logger:
  do:
    online: False
  lightweight: True
  project_name: "selfies"
  run_name: "Atom Uniform default"
  tags: 
    - gflownet
    - grid
    - corners

# Evaluator
evaluator:
  first_it: True
  period: 500
  n: 1000
  checkpoints_period: 500


# Hydra
hydra:
  run:
    dir: ${user.logdir.root}/selfies/atom/${now:%Y-%m-%d_%H-%M-%S_%f}
